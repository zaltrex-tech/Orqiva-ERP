# ==============================================================================
# Orqiva ERP - Production Nginx Reverse Proxy & Load Balancer
# Features: SSL/TLS Termination, Brotli/Gzip Compression, Brute-Force Rate Limiting,
#           WebSocket Support, Security Hardening Headers
# ==============================================================================

user nginx nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    log_format orqiva_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/orqiva_access.log orqiva_combined buffer=64k flush=5s;
    error_log /var/log/nginx/orqiva_error.log warn;

    # --------------------------------------------------------------------------
    # Kernel & TCP Optimization
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS & Brute-Force Mitigation)
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general_limit:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # Gzip & Static Asset Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # WebSocket Connection Upgrade Mapping
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # Upstream Next.js 15 Application Server
    # --------------------------------------------------------------------------
    upstream orqiva_backend {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # Server Block: HTTP Port 80 (Redirect to HTTPS & ACME Challenge)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME-challenge for Let's Encrypt / Certbot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # Server Block: HTTPS Port 443 (Production SSL Termination)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # SSL Certificates (Mount appropriate host certs into container)
        ssl_certificate /etc/nginx/ssl/orqiva.crt;
        ssl_certificate_key /etc/nginx/ssl/orqiva.key;

        # TLS Protocols & Cipher Suites (Mozilla Modern Configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        ssl_session_timeout 1d;
        ssl_session_cache shared:OrqivaSSL:20m;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # Strict Enterprise Security Headers
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # ----------------------------------------------------------------------
        # Location: Authentication Endpoint Rate Limiting (Brute Force Defense)
        # ----------------------------------------------------------------------
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://orqiva_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # Location: General API Endpoints
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://orqiva_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Location: Next.js Static Chunks & Caching
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://orqiva_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Location: Public Assets & Favicons
        # ----------------------------------------------------------------------
        location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
            proxy_pass http://orqiva_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Location: Default App Proxy with WebSocket Upgrades
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://orqiva_backend;
            proxy_http_version 1.1;

            # HTTP & WebSocket Upgrades
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
        }
    }
}
